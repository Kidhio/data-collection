<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <h2>DATA COLLECTION FORM</h2>

  <!-- Use a form service endpoint or Netlify attribute in action -->
  <form action="kidhio@gmail.com" method="POST">
    
    <!-- Replace this with your free access key from Web3Forms or Netlify -->
    <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="message">Message / Data:</label><br>
    <textarea id="message" name="message" rows="4" required></textarea><br><br>

    <button type="submit">Submit</button>
  </form>

</body>
